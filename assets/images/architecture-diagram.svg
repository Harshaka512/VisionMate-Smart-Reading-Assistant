<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%" style="background: #090d16; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="300" y1="0" x2="300" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="900" y1="0" x2="900" y2="720"/>
    <line x1="1100" y1="0" x2="1100" y2="720"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)"/>
    <text x="85" y="17" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SYSTEM ARCHITECTURE</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">VisionMate Edge-Cloud Assistive Pipeline</text>
    <text x="500" y="52" fill="#94a3b8" font-size="14" font-weight="400">Research Group R26-IT-41 · End-to-End Multimodal Dataflow</text>
  </g>

  <!-- SECTION 1: HARDWARE LAYER (Left Column) -->
  <g transform="translate(50, 130)" filter="url(#shadow)">
    <rect width="240" height="530" rx="16" fill="url(#boxBlue)" stroke="#1e3a8a" stroke-width="1.5"/>
    <rect x="16" y="16" width="208" height="32" rx="8" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="120" y="37" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">HARDWARE & SENSORS</text>
    
    <!-- Hardware Item 1 -->
    <g transform="translate(18, 65)">
      <rect width="204" height="68" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="34" r="14" fill="#1e293b"/>
      <path d="M22 34 h12 M28 28 v12" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="28" fill="#f1f5f9" font-size="12" font-weight="700">Wearable Headset</text>
      <text x="50" y="44" fill="#94a3b8" font-size="10">Ergonomic lightweight frame</text>
      <text x="50" y="58" fill="#38bdf8" font-size="9" font-weight="600">Raspberry Pi 5 Compute Unit</text>
    </g>

    <!-- Hardware Item 2 -->
    <g transform="translate(18, 145)">
      <rect width="204" height="68" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="34" r="14" fill="#1e293b"/>
      <circle cx="28" cy="34" r="6" fill="#38bdf8"/>
      <text x="50" y="28" fill="#f1f5f9" font-size="12" font-weight="700">HD Wide-Angle Camera</text>
      <text x="50" y="44" fill="#94a3b8" font-size="10">IMX219 sensor module</text>
      <text x="50" y="58" fill="#34d399" font-size="9" font-weight="600">Continuous 1080p stream</text>
    </g>

    <!-- Hardware Item 3 -->
    <g transform="translate(18, 225)">
      <rect width="204" height="68" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="34" r="14" fill="#1e293b"/>
      <rect x="22" y="28" width="12" height="12" rx="2" fill="#ec4899"/>
      <text x="50" y="28" fill="#f1f5f9" font-size="12" font-weight="700">RFID Identification</text>
      <text x="50" y="44" fill="#94a3b8" font-size="10">RC522 contactless reader</text>
      <text x="50" y="58" fill="#ec4899" font-size="9" font-weight="600">Instant user profile login</text>
    </g>

    <!-- Hardware Item 4 -->
    <g transform="translate(18, 305)">
      <rect width="204" height="68" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="34" r="14" fill="#1e293b"/>
      <path d="M24 30 a8 8 0 0 1 8 8" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <text x="50" y="28" fill="#f1f5f9" font-size="12" font-weight="700">Microphone & Speech</text>
      <text x="50" y="44" fill="#94a3b8" font-size="10">Noise-canceling MEMS mic</text>
      <text x="50" y="58" fill="#f59e0b" font-size="9" font-weight="600">Interactive voice commands</text>
    </g>

    <!-- Hardware Item 5 -->
    <g transform="translate(18, 385)">
      <rect width="204" height="68" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <circle cx="28" cy="34" r="14" fill="#1e293b"/>
      <path d="M22 34 c3 -6, 9 -6, 12 0" stroke="#a855f7" stroke-width="2" fill="none"/>
      <text x="50" y="28" fill="#f1f5f9" font-size="12" font-weight="700">Audio Output Device</text>
      <text x="50" y="44" fill="#94a3b8" font-size="10">Bone conduction earphones</text>
      <text x="50" y="58" fill="#a855f7" font-size="9" font-weight="600">Spatial situational awareness</text>
    </g>

    <!-- Hardware Item 6 -->
    <g transform="translate(18, 465)">
      <rect width="204" height="50" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1"/>
      <text x="24" y="24" fill="#94a3b8" font-size="11">Battery & Power Mgmt:</text>
      <text x="24" y="40" fill="#38bdf8" font-size="11" font-weight="600">3.7V Li-ion + DC-DC Buck Reg.</text>
    </g>
  </g>

  <!-- CONNECTOR: Hardware -> Module 1 -->
  <path d="M 290 230 L 340 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <path d="M 290 380 L 315 380 L 315 540 L 340 540" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- SECTION 2: 4 RESEARCH MODULES (Center Grid) -->

  <!-- MODULE 1: Camera Guidance (Priyashantha) -->
  <g transform="translate(345, 130)" filter="url(#shadow)">
    <rect width="400" height="245" rx="16" fill="url(#boxBlue)" stroke="#0284c7" stroke-width="1.5"/>
    <path d="M0 16 C0 7 7 0 16 0 L384 0 C393 0 400 7 400 16 L400 42 L0 42 Z" fill="rgba(14, 165, 233, 0.15)"/>
    <text x="20" y="27" fill="#38bdf8" font-size="13" font-weight="700">MODULE 1 · PRIYASHANTHA D.G.M.D</text>
    <rect x="290" y="10" width="95" height="22" rx="11" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="337" y="25" fill="#bae6fd" font-size="10" font-weight="600" text-anchor="middle">IT22295392</text>
    
    <text x="20" y="65" fill="#f8fafc" font-size="15" font-weight="700">Automatic Camera Position Guidance</text>
    
    <!-- Flow Sub-boxes -->
    <g transform="translate(18, 80)">
      <rect width="170" height="48" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="600">YOLOv8n Page Detector</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">Boundary & 4-corner localizer</text>
    </g>

    <g transform="translate(205, 80)">
      <rect width="175" height="48" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="600">Geometric Tilt & Distance</text>
      <text x="12" y="36" fill="#94a3b8" font-size="9.5">Perspective skew analysis</text>
    </g>

    <g transform="translate(18, 140)">
      <rect width="170" height="52" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="600">Voice Guidance Engine</text>
      <text x="12" y="35" fill="#94a3b8" font-size="9">"Move left / right / hold steady"</text>
      <text x="12" y="47" fill="#38bdf8" font-size="8.5">Real-time low-latency cues</text>
    </g>

    <g transform="translate(205, 140)">
      <rect width="175" height="52" rx="8" fill="#064e3b" stroke="#10b981"/>
      <text x="12" y="20" fill="#34d399" font-size="11" font-weight="700">Auto-Capture Decision</text>
      <text x="12" y="35" fill="#a7f3d0" font-size="9">Readiness threshold verified</text>
      <text x="12" y="47" fill="#34d399" font-size="8.5">Trigger crisp hi-res frame</text>
    </g>

    <!-- Tech tags -->
    <text x="20" y="222" fill="#64748b" font-size="10.5">Stack: <tspan fill="#94a3b8">YOLOv8n · OpenCV · Geometric Rules · Raspberry Pi 5</tspan></text>
  </g>

  <!-- CONNECTOR: Module 1 -> Module 2 & 3 -->
  <path d="M 745 220 L 795 220" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- MODULE 2: Document Identification & Image Description (Chithrasena) -->
  <g transform="translate(800, 130)" filter="url(#shadow)">
    <rect width="350" height="245" rx="16" fill="url(#boxBlue)" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M0 16 C0 7 7 0 16 0 L334 0 C343 0 350 7 350 16 L350 42 L0 42 Z" fill="rgba(99, 102, 241, 0.15)"/>
    <text x="18" y="27" fill="#818cf8" font-size="13" font-weight="700">MODULE 2 · CHITHRASENA D.C.M.A</text>
    <rect x="250" y="10" width="85" height="22" rx="11" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="292" y="25" fill="#c7d2fe" font-size="10" font-weight="600" text-anchor="middle">IT22114112</text>
    
    <text x="18" y="65" fill="#f8fafc" font-size="14.5" font-weight="700">Document ID & Visual Description</text>
    
    <g transform="translate(16, 78)">
      <rect width="150" height="52" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="10" y="20" fill="#e2e8f0" font-size="10.5" font-weight="600">MobileNetV2 Classifier</text>
      <text x="10" y="34" fill="#94a3b8" font-size="9">Book / Paper / Letter / Report</text>
      <text x="10" y="46" fill="#818cf8" font-size="8.5">97.8% multi-class accuracy</text>
    </g>

    <g transform="translate(178, 78)">
      <rect width="156" height="52" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="10" y="20" fill="#e2e8f0" font-size="10.5" font-weight="600">Title OCR Extraction</text>
      <text x="10" y="34" fill="#94a3b8" font-size="9">EasyOCR headline parse</text>
      <text x="10" y="46" fill="#818cf8" font-size="8.5">Reads cover title first</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="318" height="52" rx="8" fill="#0b1329" stroke="#4338ca"/>
      <text x="12" y="20" fill="#a5b4fc" font-size="11" font-weight="700">Multimodal Inside-Page Image Describer</text>
      <text x="12" y="35" fill="#94a3b8" font-size="9.5">Vision-Language Model translates diagrams, photos & figures</text>
      <text x="12" y="47" fill="#818cf8" font-size="8.5">Generates rich accessible acoustic descriptions</text>
    </g>

    <text x="18" y="222" fill="#64748b" font-size="10.5">Stack: <tspan fill="#94a3b8">MobileNetV2 · PyTorch · EasyOCR · FastAPI</tspan></text>
  </g>

  <!-- MODULE 3: Content Summarization & Category Detection (Herath) -->
  <g transform="translate(345, 410)" filter="url(#shadow)">
    <rect width="400" height="250" rx="16" fill="url(#boxBlue)" stroke="#059669" stroke-width="1.5"/>
    <path d="M0 16 C0 7 7 0 16 0 L384 0 C393 0 400 7 400 16 L400 42 L0 42 Z" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="20" y="27" fill="#34d399" font-size="13" font-weight="700">MODULE 3 · HERATH H M M G E H B</text>
    <rect x="290" y="10" width="95" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="337" y="25" fill="#a7f3d0" font-size="10" font-weight="600" text-anchor="middle">IT22198136</text>
    
    <text x="20" y="65" fill="#f8fafc" font-size="15" font-weight="700">Summarization & Category Detection</text>
    
    <g transform="translate(18, 80)">
      <rect width="170" height="50" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="600">Multi-Category Detection</text>
      <text x="12" y="34" fill="#94a3b8" font-size="9">Newspaper column segments</text>
      <text x="12" y="45" fill="#34d399" font-size="8.5">Politics / Sports / Tech / Biz</text>
    </g>

    <g transform="translate(205, 80)">
      <rect width="175" height="50" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="12" y="20" fill="#e2e8f0" font-size="11" font-weight="600">Interactive User Choice</text>
      <text x="12" y="34" fill="#94a3b8" font-size="9">Voice-selected topics</text>
      <text x="12" y="45" fill="#34d399" font-size="8.5">Avoids listening to full page</text>
    </g>

    <g transform="translate(18, 142)">
      <rect width="362" height="52" rx="8" fill="#0b1329" stroke="#047857"/>
      <text x="12" y="20" fill="#6ee7b7" font-size="11" font-weight="700">Edge LLM Summarization Engine (Ollama LLaMA)</text>
      <text x="12" y="35" fill="#94a3b8" font-size="9.5">Extracts key highlights vs. verbatim reading modes on-demand</text>
      <text x="12" y="47" fill="#34d399" font-size="8.5">Fast local inference with zero privacy leakage</text>
    </g>

    <text x="20" y="225" fill="#64748b" font-size="10.5">Stack: <tspan fill="#94a3b8">Python · Tesseract · Scikit-learn · Ollama LLaMA · FastAPI</tspan></text>
  </g>

  <!-- MODULE 4: Personalized Adaptive Reading (Praveesha) -->
  <g transform="translate(800, 410)" filter="url(#shadow)">
    <rect width="350" height="250" rx="16" fill="url(#boxBlue)" stroke="#db2777" stroke-width="1.5"/>
    <path d="M0 16 C0 7 7 0 16 0 L334 0 C343 0 350 7 350 16 L350 42 L0 42 Z" fill="rgba(236, 72, 153, 0.15)"/>
    <text x="18" y="27" fill="#f472b6" font-size="13" font-weight="700">MODULE 4 · PRAVEESHA R.G.R</text>
    <rect x="250" y="10" width="85" height="22" rx="11" fill="rgba(236, 72, 153, 0.2)"/>
    <text x="292" y="25" fill="#fbcfe8" font-size="10" font-weight="600" text-anchor="middle">IT22299970</text>
    
    <text x="18" y="65" fill="#f8fafc" font-size="14.5" font-weight="700">Adaptive Reading & Page Completion</text>
    
    <g transform="translate(16, 78)">
      <rect width="150" height="52" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="10" y="19" fill="#e2e8f0" font-size="10.5" font-weight="600">RFID Profile Sync</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9">Child / Student / Senior</text>
      <text x="10" y="45" fill="#f472b6" font-size="8.5">Auto-loads custom prefs</text>
    </g>

    <g transform="translate(178, 78)">
      <rect width="156" height="52" rx="8" fill="#0b1329" stroke="#334155"/>
      <text x="10" y="19" fill="#e2e8f0" font-size="10.5" font-weight="600">Tone & Pace Engine</text>
      <text x="10" y="32" fill="#94a3b8" font-size="9">Friendly / Playful / Formal</text>
      <text x="10" y="45" fill="#f472b6" font-size="8.5">Pitch & speed calibration</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="318" height="52" rx="8" fill="#0b1329" stroke="#9d174d"/>
      <text x="12" y="20" fill="#f472b6" font-size="11" font-weight="700">Page-End Detection & "Turn Next Page" Prompt</text>
      <text x="12" y="35" fill="#94a3b8" font-size="9.5">Detects sentence bounds and cues tactile next-page turnover</text>
      <text x="12" y="47" fill="#f472b6" font-size="8.5">Seamless hands-free continuous book reading</text>
    </g>

    <text x="18" y="225" fill="#64748b" font-size="10.5">Stack: <tspan fill="#94a3b8">RFID Module · Text Simplification · Neural TTS Engine</tspan></text>
  </g>

  <!-- INTER-MODULE FEEDBACK ARROWS -->
  <path d="M 545 375 L 545 405" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 745 520 L 795 520" fill="none" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 975 375 L 975 405" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 975 660 L 975 690 L 170 690 L 170 665" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="560" y="683" fill="#ec4899" font-size="10" font-weight="600" text-anchor="middle">Closed-Loop Audio Delivery &amp; Continuous Next-Page Trigger to Wearable Headphones</text>
</svg>
