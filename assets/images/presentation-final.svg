<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <filter id="deckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Slide Canvas Background -->
  <rect width="1280" height="720" fill="url(#deckBg)"/>

  <!-- High-Tech Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1100" cy="180" r="260" fill="#6366f1" opacity="0.12" filter="blur(60px)"/>
  <circle cx="200" cy="560" r="220" fill="#06b6d4" opacity="0.1" filter="blur(50px)"/>

  <!-- Top Pill / Institution Badges -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text x="110" y="24" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      SLIIT CDAP 2026
    </text>

    <rect x="235" y="0" width="220" height="38" rx="19" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <text x="345" y="24" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      VIVA VOCE DEFENSE
    </text>
  </g>

  <!-- Title & Academic Heading -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="2">
      FINAL EXAMINATION &amp; ORAL DEFENSE SLIDE DECK
    </text>
    <text x="0" y="65" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
      VisionMate
    </text>
    <text x="290" y="65" fill="url(#accentGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
      System Defense
    </text>
    <text x="0" y="115" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" max-width="800">
      Smart Wearable Reading Assistant for the Visually Impaired
    </text>
  </g>

  <!-- 4 Architecture Pillar Badges -->
  <g transform="translate(100, 380)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <text x="20" y="38" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MODULE 01 · RPi 5</text>
      <text x="20" y="65" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">YOLOv8n Camera Guidance</text>
      <text x="20" y="88" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Perspective skew &amp; audio cue</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(270, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
      <text x="20" y="38" fill="#818cf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MODULE 02 · MOBILENET</text>
      <text x="20" y="65" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Document Recognition</text>
      <text x="20" y="88" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">MobileNetV2 &amp; EasyOCR</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(540, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
      <text x="20" y="38" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MODULE 03 · LLAMA</text>
      <text x="20" y="65" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Adaptive Summarization</text>
      <text x="20" y="88" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Ollama local edge model</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(810, 0)">
      <rect width="245" height="110" rx="12" fill="url(#cardGrad)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
      <text x="20" y="38" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MODULE 04 · TTS &amp; RFID</text>
      <text x="20" y="65" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Age-Adaptive Synthesis</text>
      <text x="20" y="88" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">RFID profile &amp; tone tuning</text>
    </g>
  </g>

  <!-- Footer Banner: Cohort & Viva Status -->
  <g transform="translate(100, 580)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="0" y="42" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      Research Cohort: R26-IT-41
    </text>
    <text x="240" y="42" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15">
      SLIIT Faculty of Computing · Centre of Excellence for AI (CoEAI)
    </text>
    <text x="1080" y="42" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="end">
      Final Examination &amp; Viva Voce · 20% Total Weight
    </text>
  </g>
</svg>
